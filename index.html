<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Advanced Digital Clock</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="clock">

    <!-- Seconds Circle -->
    <div class="circle">
        <svg width="140" height="140">
            <circle class="bg" cx="70" cy="70" r="70"/>
            <circle class="progress" cx="70" cy="70" r="70" id="secCircle"/>
        </svg>
    </div>

    <div>
        <span id="time">00:00:00</span>
        <span id="ampm">AM</span>
    </div>

    <div id="date">Loading...</div>

    <div class="controls">
        <button onclick="toggleMode()">🌓 Mode</button>
        <button onclick="toggleFormat()">🕰 24h</button>
    </div>

</div>

<script src="./script.js"></script>

</body>
</html>
